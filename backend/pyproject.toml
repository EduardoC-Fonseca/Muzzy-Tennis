[project]
name = "muzzi-tennis-backend"
version = "0.1.0"
description = "API do Muzzi Tennis — reserva de quadras de tênis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "pymysql>=1.1",
    "cryptography>=43",          # exigido pelo PyMySQL para auth caching_sha2 do MySQL 8
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.17",  # formulários (login OAuth2) e upload de fotos
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() em argumentos padrão é o padrão do FastAPI
